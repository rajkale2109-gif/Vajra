<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>Vajra — Governance</title>
  <style>
  :root{--navy:#111A36;--pri:#4568F5;--tx:#172033;--tx2:#64748B;--bg:#F7F8FC;--card:#fff;--bd:#E5E9F2;--ok:#16845B;--bad:#DC5252;--warn:#D99025;--info:#4777D9;--neu:#8792A5;--hov:#F1F4FC;--sel:#EEF1FE;color-scheme:light;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
  @media(prefers-color-scheme:dark){:root:not([data-theme=light]){--bg:#0C1126;--card:#151C36;--tx:#E6E9F2;--tx2:#9AA6BD;--bd:#263052;--hov:#1B2444;--sel:#1D2750;--ok:#34C48B;--bad:#F07878;--warn:#EBB04F;color-scheme:dark}}
  *{box-sizing:border-box}html{scroll-padding-top:env(safe-area-inset-top,0px)}body{margin:0;font:13px/1.45 Inter,system-ui,-apple-system,"Segoe UI",sans-serif;background:var(--bg);color:var(--tx)}
  button,input,select,textarea{font:inherit;color:inherit}button{cursor:pointer}:focus-visible{outline:2px solid var(--pri);outline-offset:1px}
  #app{display:flex;min-height:100vh}aside{width:216px;background:var(--navy);color:#C9D1E8;display:flex;flex-direction:column;position:sticky;top:0;height:100vh;flex:none;transition:width .15s}
  aside.c{width:60px}aside.c .lb{display:none}.brand{padding:16px;color:#fff;font-weight:700;letter-spacing:.14em;font-size:15px}.brand small{display:block;font-weight:500;letter-spacing:.05em;color:#8E9ABF;font-size:11px;margin-top:2px}
  .nv{display:flex;gap:10px;align-items:center;padding:9px 16px;margin:2px 8px;border-radius:6px;background:none;border:0;color:inherit;text-align:left;width:calc(100% - 16px)}.nv:hover{background:#1C2750}.nv.a{background:var(--pri);color:#fff}
  .mn{flex:1;min-width:0}header{display:flex;gap:12px;align-items:center;padding:9px 24px;background:var(--card);border-bottom:1px solid var(--bd);position:sticky;top:0;z-index:5;flex-wrap:wrap}
  .cr{color:var(--tx2);flex:1}.cr b{color:var(--tx)}main{padding:20px 24px;max-width:1500px}h1{font-size:20px;margin:0}h2{font-size:14px;margin:0}.sub{color:var(--tx2)}
  .card{background:var(--card);border:1px solid var(--bd);border-radius:8px;padding:14px;margin-bottom:16px}.row{display:flex;gap:10px;align-items:center;flex-wrap:wrap}.sp{flex:1}
  .kp{display:grid;grid-template-columns:repeat(6,1fr);gap:10px;margin:14px 0}.kp .card{margin:0;padding:11px}.kv{font-size:19px;font-weight:650;font-variant-numeric:tabular-nums}
  .btn{border:1px solid var(--bd);background:var(--card);border-radius:6px;padding:6px 11px}.btn:hover{background:var(--hov)}.btn.p{background:var(--pri);border-color:var(--pri);color:#fff}.btn.p:hover{filter:brightness(.92)}.btn.d{color:var(--bad)}.btn:disabled{opacity:.5;cursor:not-allowed}
  input,select,textarea{border:1px solid var(--bd);background:var(--card);border-radius:6px;padding:6px 8px}input[type=checkbox]{width:15px;height:15px;padding:0}
  table{width:100%;border-collapse:collapse;font-variant-numeric:tabular-nums}th,td{padding:7px 9px;border-bottom:1px solid var(--bd);text-align:left;white-space:nowrap}td.r,th.r{text-align:right}th{position:sticky;top:0;background:var(--card);font-size:11px;color:var(--tx2);text-transform:uppercase;letter-spacing:.03em}th button{all:unset;cursor:pointer}tbody tr:hover{background:var(--hov)}tr.sl{background:#4568F514}.tw{overflow:auto;max-height:560px}
  .lnk{all:unset;cursor:pointer;color:var(--pri);font-weight:600}.lnk:hover{text-decoration:underline}.raw{font-size:10.5px;color:var(--tx2);max-width:300px;overflow:hidden;text-overflow:ellipsis}
  .bd{display:inline-block;padding:1px 7px;border-radius:10px;font-size:11px;font-weight:600;border:1px solid currentColor}.ok{color:var(--ok)}.bad{color:var(--bad)}.warn,.w{color:var(--warn)}.info{color:var(--info)}.n{color:var(--neu)}
  .tabs{display:flex;gap:2px;border-bottom:1px solid var(--bd);margin-bottom:10px}.tabs button{background:none;border:0;padding:7px 12px;border-bottom:2px solid transparent;color:var(--tx2)}.tabs .a{color:var(--pri);border-color:var(--pri);font-weight:600}
  .iss{display:flex;gap:12px;padding:10px;border:1px solid var(--bd);border-left:4px solid var(--warn);border-radius:6px;margin-bottom:8px;align-items:flex-start}.iss.High{border-left-color:var(--bad)}.iss.Info{border-left-color:var(--info)}
  .bar{position:sticky;bottom:8px;background:var(--navy);color:#fff;padding:9px 14px;border-radius:8px;display:flex;gap:8px;align-items:center;margin-top:8px}.bar .btn{background:#1C2750;border-color:#33406F;color:#fff}
  .mo{position:fixed;inset:0;background:#0A102A99;display:flex;align-items:center;justify-content:center;z-index:20;padding:16px}.md{background:var(--card);border-radius:10px;padding:18px;width:560px;max-width:100%;max-height:90vh;overflow:auto}.md.l{width:720px}
  .fl{display:grid;gap:4px;margin-bottom:10px}.fl input,.fl select,.fl textarea{width:100%}.er{color:var(--bad);font-size:12px}.ck{max-height:170px;overflow:auto;border:1px solid var(--bd);border-radius:6px;padding:6px}.ck label{display:flex;gap:8px;padding:2px}
  .dd{position:absolute;right:0;top:34px;background:var(--card);border:1px solid var(--bd);border-radius:8px;width:320px;box-shadow:0 8px 24px #0002;z-index:9;padding:6px}.dd button{display:block;width:100%;text-align:left;background:none;border:0;padding:7px;border-radius:5px}.dd button:hover{background:var(--hov)}
  #toast{position:fixed;bottom:18px;right:18px;z-index:40;display:grid;gap:6px}#toast div{background:var(--navy);color:#fff;padding:9px 14px;border-radius:6px;border-left:4px solid var(--ok)}
  .emp{text-align:center;padding:36px;color:var(--tx2)}.ban{padding:8px 12px;border-radius:6px;background:#D9902518;border:1px solid var(--warn);margin-bottom:12px}.pl{font-weight:600}.pl.Meta{color:#2F6FE0}.pl.Google{color:#D9502F}
  .kp.k5{grid-template-columns:repeat(5,1fr)}
  .fl label{font-weight:600;font-size:12px}details summary{cursor:pointer}.iss.High .sp{min-width:0}.md h2{font-size:16px}
  @media(max-width:1100px){.kp,.kp.k5{grid-template-columns:repeat(3,1fr)}#app{padding-left:60px}aside{position:fixed;left:0;top:0;z-index:15}aside:not(.c){box-shadow:4px 0 24px #0005}.gd{position:fixed;right:0;top:0;z-index:18;box-shadow:-4px 0 24px #0004;max-width:92vw}}@media(max-width:700px){.kp,.kp.k5{grid-template-columns:repeat(2,1fr)}main{padding:12px}}
  .s2{font-size:11px;line-height:1.25;color:var(--tx2);margin-top:1px;font-weight:400}.bar{flex-wrap:wrap}
  .sr{position:absolute;left:-9999px;width:1px;height:1px;overflow:hidden}.sk:focus{left:8px;top:8px;width:auto;height:auto;background:var(--card);padding:8px 12px;z-index:50;border-radius:6px}
  .cs th:first-child,.cs td:first-child{width:34px;min-width:34px}.cs th:nth-child(-n+2),.cs td:nth-child(-n+2){position:sticky;background:var(--card);z-index:1}.cs th:nth-child(1),.cs td:nth-child(1){left:0}.cs th:nth-child(2),.cs td:nth-child(2){left:34px;box-shadow:1px 0 0 var(--bd)}.cs th:nth-child(-n+2){z-index:3}.cs tbody tr:hover td:nth-child(-n+2){background:var(--hov)}.cs tr.sl td:nth-child(-n+2){background:var(--sel)}
  .seg .btn{border-radius:0;margin-left:-1px}.seg .btn:first-child{border-radius:6px 0 0 6px;margin:0}.seg .btn:last-child{border-radius:0 6px 6px 0}
  .gd{width:330px;flex:none;position:sticky;top:0;height:100vh;overflow:auto;background:var(--card);border-left:1px solid var(--bd);padding:14px;align-self:flex-start}.gd h2{font-size:16px;margin:10px 0 6px}.say{margin:0 0 10px;padding:8px 10px;border-left:3px solid var(--pri);background:var(--hov);border-radius:0 6px 6px 0}.gd ol{margin:4px 0 12px;padding-left:18px}.gd li{margin-bottom:4px}
  .steps{display:flex;gap:4px;margin-top:8px}.steps button{flex:1;border:1px solid var(--bd);background:var(--card);border-radius:4px;padding:3px 0}.steps .a{background:var(--pri);border-color:var(--pri);color:#fff}
  </style>
</head>
<body>
  <a class="sr sk" href="#main">Skip to main content</a>
  <div id="app"></div>
  <div id="modal"></div>
  <div id="modal2"></div>
  <div id="toast" role="status" aria-live="polite"></div>
  <script type="module" src="/app.js"></script>
</body>
</html>
